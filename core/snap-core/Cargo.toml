[package]
name = "snap-core"
version.workspace = true
edition.workspace = true
description = "Open tube: models, provider trait, download engine, SQLite queue"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
url = "2"
regex = "1"
aes = "0.8"
cbc = "0.1"
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
