[package]
name = "snap-core"
version.workspace = true
edition.workspace = true
description = "Open tube: models, provider trait, download engine, SQLite queue"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
