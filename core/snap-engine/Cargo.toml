[package]
name = "snap-engine"
version.workspace = true
edition.workspace = true
description = "Open tube: download engine (direct HTTP + HLS) with progress callbacks"
license = "GPL-3.0-or-later"

[dependencies]
snap-core = { path = "../snap-core" }
snap-hls = { path = "../snap-hls" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"
