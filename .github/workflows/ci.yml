name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (see rust-toolchain.toml)
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        # ubuntu-latest ships cmdline-tools and the SDK at $ANDROID_HOME.
        # Do not use android-actions/setup-android: it installs the removed
        # `tools` package and fails on current SDK repositories.
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Rust targets and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2

      - name: Export NDK location
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build host cdylib (source of UniFFI metadata)
        run: cargo build -p snap-ffi

      - name: Generate Kotlin bindings
        run: |
          cargo run -p snap-ffi --features cli --bin uniffi-bindgen -- generate \
            --library target/debug/libsnap_ffi.so \
            --language kotlin \
            --out-dir app/build/generated/uniffi \
            --no-format

      - name: Show generated bindings
        run: find app/build/generated/uniffi -type f -print -exec head -n 3 {} \;

      - name: Build Android native libraries
        env:
          CARGO_NDK_PLATFORM: '26'
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/src/main/jniLibs \
            build --release -p snap-ffi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-tube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
